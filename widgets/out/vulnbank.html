<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VulnBank</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: white;
        color: #111;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 20px;
      }

      h1 {
        margin-top: 0;
      }

      .row {
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }

      .row:last-child {
        border-bottom: none;
      }

      .severity {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>VulnBank Security Overview</h1>

      <div class="row">
        <strong>Application:</strong>
        VulnBank
      </div>

      <div class="row">
        <strong>Status:</strong>
        Security Training Application
      </div>

      <div class="row">
        <strong>Vulnerabilities:</strong>
        7
      </div>

      <div class="row">
        <strong>Critical:</strong>
        2
      </div>

      <div class="row">
        <strong>High:</strong>
        5
      </div>

      <div class="row">
        <strong>Labs:</strong>
        SQL Injection, IDOR, SSRF, Insecure Deserialization, Security
        Misconfiguration, Cryptographic Failures, Insecure Design
      </div>
    </div>
  </body>
</html>
