[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrostack"
version = "0.4.0"
description = "NitroStack Python SDK (vendored)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.20.0",
    "watchfiles>=0.18.0",
    "anyio>=4.0.0",
    "packaging>=23.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
nitrostack-py = "nitrostack.cli.main:main"

[tool.setuptools.packages.find]
include = ["nitrostack*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nitrostack = ["transports/assets/*"]
